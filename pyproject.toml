[project]
name = "hyprchan"
version = "0.1.0"
description = "hyprchan"
authors = [
    {name = "Zahcoder34",email = "Zakhriw@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ascender-framework (>=2.1.0,<3.0.0)",
    "hyprland (>=0.2.54,<0.3.0)",
    "agent-scaffolds (>=0.1.10,<0.2.0)",
    "langchain (>=0.3.0,<0.4.0)",
    "langchain-core (>=0.3.78,<0.4.0)",
    "langchain-openai (>=0.3.0,<0.4.0)",
    "tiktoken (>=0.8.0,<0.9.0)",
    "pygobject (>=3.56.0,<4.0.0)",
    "pygobject-stubs (>=2.16.0,<3.0.0)",
    "opencv-python-headless (>=4.10.0.84,<5.0.0.0)",
    "faster-whisper (>=1.1.1,<2.0.0)",
    "sounddevice (>=0.5.1,<0.6.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
